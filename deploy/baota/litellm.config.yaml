model_list:
  - model_name: local-qwen
    litellm_params:
      model: os.environ/LOCAL_QWEN_MODEL
      api_base: os.environ/LOCAL_OPENAI_BASE_URL
      api_key: os.environ/LOCAL_OPENAI_API_KEY

  - model_name: local-qwen-fast
    litellm_params:
      model: os.environ/LOCAL_QWEN_FAST_MODEL
      api_base: os.environ/LOCAL_OPENAI_BASE_URL
      api_key: os.environ/LOCAL_OPENAI_API_KEY

  - model_name: local-qwen-strong
    litellm_params:
      model: os.environ/LOCAL_QWEN_STRONG_MODEL
      api_base: os.environ/LOCAL_OPENAI_BASE_URL
      api_key: os.environ/LOCAL_OPENAI_API_KEY

litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
