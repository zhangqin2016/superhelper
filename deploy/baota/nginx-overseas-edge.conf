server {
  listen 80;
  server_name lilyxinjiapo.lilywb.cn lilyuae.lilywb.cn;
  client_max_body_size 100m;

  location /api/ {
    proxy_pass http://101.200.232.184:13000;
    proxy_http_version 1.1;
    client_body_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host lilyxinjiapo.lilywb.cn;
    proxy_set_header X-Forwarded-Host lilyxinjiapo.lilywb.cn;
    proxy_set_header X-Lily-Region uae;
    proxy_set_header X-Client-Country AE;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /llm/ {
    proxy_pass http://101.200.232.184:13000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host lilyxinjiapo.lilywb.cn;
    proxy_set_header X-Forwarded-Host lilyxinjiapo.lilywb.cn;
    proxy_set_header X-Lily-Region uae;
    proxy_set_header X-Client-Country AE;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://101.200.232.184:13000/health;
    proxy_http_version 1.1;
    proxy_set_header Host lilyxinjiapo.lilywb.cn;
    proxy_set_header X-Forwarded-Host lilyxinjiapo.lilywb.cn;
    proxy_set_header X-Lily-Region uae;
    proxy_set_header X-Client-Country AE;
  }

  location / {
    proxy_pass http://101.200.232.184:13001;
    proxy_http_version 1.1;
    proxy_set_header Host lilyxinjiapo.lilywb.cn;
    proxy_set_header X-Forwarded-Host lilyxinjiapo.lilywb.cn;
    proxy_set_header X-Lily-Region uae;
    proxy_set_header X-Client-Country AE;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
