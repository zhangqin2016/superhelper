services:
  db:
    image: postgres:16-alpine
    container_name: lily-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lily_workbench}
      POSTGRES_USER: ${POSTGRES_USER:-lily}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - lily_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lily} -d ${POSTGRES_DB:-lily_workbench}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: server/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    container_name: lily-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      IMAGE_TAG: ${IMAGE_TAG:-latest}
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-lily}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lily_workbench}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      LICENSE_PRIVATE_KEY: ${LICENSE_PRIVATE_KEY:-}
      LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY:-}
      LICENSE_PRIVATE_KEY_B64: ${LICENSE_PRIVATE_KEY_B64:-}
      LICENSE_PUBLIC_KEY_B64: ${LICENSE_PUBLIC_KEY_B64:-}
      ALLOW_UNSIGNED_LICENSES: ${ALLOW_UNSIGNED_LICENSES:-false}
      QINIU_PUBLIC_BASE_URL: ${QINIU_PUBLIC_BASE_URL:-https://qny.lanrensoft.cn}
      MODEL_GATEWAY_ENABLED: ${MODEL_GATEWAY_ENABLED:-true}
      MODEL_GATEWAY_TOKEN_SECRET: ${MODEL_GATEWAY_TOKEN_SECRET:-}
      MODEL_GATEWAY_DEFAULT_PROVIDER: ${MODEL_GATEWAY_DEFAULT_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/anthropic}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/apps/anthropic}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      KIMI_BASE_URL: ${KIMI_BASE_URL:-https://api.moonshot.ai/anthropic}
      GLM_API_KEY: ${GLM_API_KEY:-}
      GLM_BASE_URL: ${GLM_BASE_URL:-https://api.z.ai/api/anthropic}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      LOCAL_ANTHROPIC_BASE_URL: ${LOCAL_ANTHROPIC_BASE_URL:-}
      LOCAL_ANTHROPIC_API_KEY: ${LOCAL_ANTHROPIC_API_KEY:-}
      LOCAL_ANTHROPIC_MODEL: ${LOCAL_ANTHROPIC_MODEL:-local-qwen}
    command: sh -c "npm run migrate && npm run start"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ../..
      dockerfile: web/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    container_name: lily-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      API_BASE_URL: http://api:3000
      NEXT_PUBLIC_API_BASE_URL: http://api:3000
      RELEASE_CDN_BASE_URL: ${QINIU_PUBLIC_BASE_URL:-https://qny.lanrensoft.cn}
      NEXT_PUBLIC_RELEASE_CDN_BASE_URL: ${QINIU_PUBLIC_BASE_URL:-https://qny.lanrensoft.cn}
      RELEASE_CDN_PREFIX: ${RELEASE_CDN_PREFIX:-app/updates}
      NEXT_PUBLIC_RELEASE_CDN_PREFIX: ${RELEASE_CDN_PREFIX:-app/updates}

  gateway:
    image: nginx:1.27-alpine
    container_name: lily-gateway
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "${HTTP_PORT:-18080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  lily_pg_data:
