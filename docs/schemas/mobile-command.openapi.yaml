openapi: 3.1.0
info:
  title: Lily Mobile Command Pro API
  version: 1.0.0
  description: HTTP contract for Lily Workbench mobile command, pairing, remote sessions, TURN, and uploads.
servers:
  - url: /public
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    UnixMs:
      type: integer
      minimum: 0
    SignedFields:
      type: object
      required: [mobileDeviceId, timestamp, nonce, signature]
      properties:
        mobileDeviceId:
          type: string
          pattern: '^mobile_.+'
        timestamp:
          $ref: '#/components/schemas/UnixMs'
        nonce:
          type: string
          minLength: 16
          maxLength: 128
        signature:
          type: string
          minLength: 16
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, category, recoverable, userMessageKey, correlationId]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            category:
              enum: [auth, network, permission, desktop, webrtc, upload, server, protocol]
            recoverable:
              type: boolean
            userMessageKey:
              type: string
            retryAfterMs:
              type: integer
              minimum: 0
            correlationId:
              type: string
              pattern: '^corr_.+'
            details:
              type: object
              additionalProperties: true
    ErrorCode:
      enum:
        - AUTH_REQUIRED
        - ACCOUNT_NOT_ALLOWED
        - FEATURE_DISABLED
        - CONFIG_UNAVAILABLE
        - PAIRING_TOKEN_EXPIRED
        - PAIRING_TOKEN_CONSUMED
        - PAIRING_TOKEN_INVALID
        - PAIRING_DESKTOP_OFFLINE
        - PAIRING_DESKTOP_REJECTED
        - DEVICE_NOT_FOUND
        - DEVICE_REVOKED
        - DEVICE_SIGNATURE_INVALID
        - DEVICE_KEY_ROTATION_REQUIRED
        - REMOTE_SESSION_NOT_FOUND
        - REMOTE_SESSION_EXPIRED
        - REMOTE_SESSION_CONFLICT
        - REMOTE_SESSION_STALE
        - REMOTE_SESSION_ENDED
        - PERMISSION_DENIED
        - PERMISSION_APPROVAL_REQUIRED
        - PERMISSION_APPROVAL_EXPIRED
        - PERMISSION_POLICY_FAILED
        - AGENT_SESSION_NOT_FOUND
        - AGENT_BRIDGE_BUSY
        - AGENT_BRIDGE_FAILED
        - AGENT_MESSAGE_DUPLICATE
        - WEBRTC_SIGNALING_FAILED
        - WEBRTC_TURN_UNAVAILABLE
        - WEBRTC_ICE_FAILED
        - WEBRTC_DATA_CHANNEL_CLOSED
        - WEBRTC_SOURCE_UNAVAILABLE
        - INPUT_NOT_AUTHORIZED
        - INPUT_INJECTION_FAILED
        - SCREEN_CAPTURE_PERMISSION_MISSING
        - SCREEN_SOURCE_CHANGED
        - UPLOAD_TOO_LARGE
        - UPLOAD_QUOTA_EXCEEDED
        - UPLOAD_CHUNK_MISSING
        - UPLOAD_CHUNK_HASH_MISMATCH
        - UPLOAD_FILE_HASH_MISMATCH
        - UPLOAD_EXPIRED
        - UPLOAD_DESKTOP_PULL_FAILED
        - UPLOAD_STAGING_FAILED
        - UPLOAD_RISK_APPROVAL_REQUIRED
        - ARTIFACT_NOT_FOUND
        - ARTIFACT_EXPIRED
        - ARTIFACT_DOWNLOAD_DENIED
        - REQUEST_INVALID
        - REQUEST_CLOCK_SKEW
        - REQUEST_REPLAY_DETECTED
        - REQUEST_IDEMPOTENCY_CONFLICT
        - SERVER_RATE_LIMITED
        - SERVER_UNAVAILABLE
    PermissionLevel:
      type: integer
      enum: [0, 1, 2, 3, 4, 5, 6]
    StartPairingRequest:
      type: object
      required: [desktopDeviceId, desktopName, supportedProtocolVersions]
      properties:
        desktopDeviceId:
          type: string
          pattern: '^desktop_.+'
        desktopName:
          type: string
          minLength: 1
          maxLength: 120
        supportedProtocolVersions:
          type: array
          items:
            type: integer
          minItems: 1
    StartPairingResponse:
      type: object
      required: [pairingId, qrPayload, expiresAt, protocolVersion]
      properties:
        pairingId:
          type: string
          pattern: '^pair_.+'
        qrPayload:
          type: string
          minLength: 1
        expiresAt:
          $ref: '#/components/schemas/UnixMs'
        protocolVersion:
          const: 1
    ConsumePairingRequest:
      allOf:
        - $ref: '#/components/schemas/SignedFields'
        - type: object
          required: [pairingToken, mobileDeviceName, mobilePlatform, mobilePublicKey, appVersion, supportedProtocolVersions]
          properties:
            pairingToken:
              type: string
            mobileDeviceName:
              type: string
              minLength: 1
              maxLength: 120
            mobilePlatform:
              enum: [ios, android, web]
            mobilePublicKey:
              type: string
            appVersion:
              type: string
            supportedProtocolVersions:
              type: array
              items:
                type: integer
              minItems: 1
    ConsumePairingResponse:
      type: object
      required: [mobileDeviceId, desktopDeviceId, requiresDesktopApproval, approvalExpiresAt, protocolVersion]
      properties:
        mobileDeviceId:
          type: string
          pattern: '^mobile_.+'
        desktopDeviceId:
          type: string
          pattern: '^desktop_.+'
        requiresDesktopApproval:
          const: true
        approvalExpiresAt:
          $ref: '#/components/schemas/UnixMs'
        protocolVersion:
          const: 1
    CreateRemoteSessionRequest:
      allOf:
        - $ref: '#/components/schemas/SignedFields'
        - type: object
          required: [desktopDeviceId, requestedLevel]
          properties:
            desktopDeviceId:
              type: string
              pattern: '^desktop_.+'
            requestedLevel:
              const: 1
            preferredLilySessionId:
              type: string
    CreateRemoteSessionResponse:
      type: object
      required: [remoteSessionId, desktopDeviceId, mobileDeviceId, permissionLevel, expiresAt, commandWsUrl]
      properties:
        remoteSessionId:
          type: string
          pattern: '^rs_.+'
        desktopDeviceId:
          type: string
          pattern: '^desktop_.+'
        mobileDeviceId:
          type: string
          pattern: '^mobile_.+'
        lilySessionId:
          type: string
        permissionLevel:
          const: 1
        expiresAt:
          $ref: '#/components/schemas/UnixMs'
        commandWsUrl:
          type: string
    RequestPermissionRequest:
      allOf:
        - $ref: '#/components/schemas/SignedFields'
        - type: object
          required: [requestedLevel, reason, ttlSeconds]
          properties:
            requestedLevel:
              $ref: '#/components/schemas/PermissionLevel'
            reason:
              type: string
              minLength: 1
              maxLength: 500
            ttlSeconds:
              type: integer
              minimum: 1
              maximum: 3600
            screenSourceId:
              type: string
    RequestPermissionResponse:
      oneOf:
        - type: object
          required: [status, permissionLevel, expiresAt]
          properties:
            status:
              const: granted
            permissionLevel:
              $ref: '#/components/schemas/PermissionLevel'
            expiresAt:
              $ref: '#/components/schemas/UnixMs'
        - type: object
          required: [status, approvalId, expiresAt]
          properties:
            status:
              const: pending_desktop_approval
            approvalId:
              type: string
              pattern: '^appr_.+'
            expiresAt:
              $ref: '#/components/schemas/UnixMs'
        - type: object
          required: [status, reasonCode]
          properties:
            status:
              const: denied
            reasonCode:
              $ref: '#/components/schemas/ErrorCode'
    TurnCredentialsResponse:
      type: object
      required: [iceServers, expiresAt]
      properties:
        iceServers:
          type: array
          items:
            type: object
            required: [urls]
            properties:
              urls:
                type: array
                items:
                  type: string
                minItems: 1
              username:
                type: string
              credential:
                type: string
        expiresAt:
          $ref: '#/components/schemas/UnixMs'
paths:
  /mobile/pairing/start:
    post:
      operationId: startMobilePairing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartPairingRequest'
      responses:
        '200':
          description: Pairing started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartPairingResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /mobile/pairing/consume:
    post:
      operationId: consumeMobilePairing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumePairingRequest'
      responses:
        '200':
          description: Pairing consumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsumePairingResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /remote/sessions:
    post:
      operationId: createRemoteSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRemoteSessionRequest'
      responses:
        '200':
          description: Remote session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRemoteSessionResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /remote/sessions/{remoteSessionId}/permissions:
    post:
      operationId: requestRemotePermission
      parameters:
        - name: remoteSessionId
          in: path
          required: true
          schema:
            type: string
            pattern: '^rs_.+'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPermissionRequest'
      responses:
        '200':
          description: Permission decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestPermissionResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /remote/turn-credentials:
    post:
      operationId: getTurnCredentials
      responses:
        '200':
          description: TURN credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnCredentialsResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
