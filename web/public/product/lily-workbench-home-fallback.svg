<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Lily Workbench</title>
  <desc id="desc">A clean Lily Workbench window showing a synthetic launch project.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef1ff"/>
      <stop offset="1" stop-color="#f8f9fd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#29335c" flood-opacity=".17"/>
    </filter>
  </defs>
  <rect width="1600" height="1040" rx="56" fill="url(#canvas)"/>
  <circle cx="1390" cy="90" r="240" fill="#dce3ff" opacity=".68"/>
  <circle cx="190" cy="990" r="280" fill="#e7f4ef" opacity=".72"/>
  <g filter="url(#shadow)">
    <rect x="112" y="86" width="1376" height="866" rx="30" fill="#fff"/>
    <rect x="112" y="86" width="1376" height="70" rx="30" fill="#121827"/>
    <rect x="112" y="126" width="1376" height="30" fill="#121827"/>
    <circle cx="158" cy="121" r="8" fill="#ff7c72"/>
    <circle cx="184" cy="121" r="8" fill="#f7c85e"/>
    <circle cx="210" cy="121" r="8" fill="#63c68d"/>
    <text x="252" y="129" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="650" fill="#fff">Lily Workbench</text>
    <rect x="112" y="156" width="316" height="796" fill="#f6f8fd"/>
    <line x1="428" y1="156" x2="428" y2="952" stroke="#e4e8f2"/>
    <text x="152" y="208" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#7d859c">WORKSPACES</text>
    <rect x="140" y="232" width="260" height="64" rx="14" fill="#e8ecff"/>
    <rect x="158" y="249" width="30" height="30" rx="8" fill="#586ce8"/>
    <path d="M166 259h7l3 3h7v9h-17z" fill="#fff" opacity=".95"/>
    <text x="204" y="260" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="650" fill="#202a49">产品上线资料</text>
    <text x="204" y="281" font-family="Inter,Arial,sans-serif" font-size="12" fill="#747e9b">8 个文件 · 今天更新</text>
    <text x="158" y="342" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#47516d">客户反馈整理</text>
    <text x="158" y="390" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#47516d">季度复盘</text>
    <line x1="140" y1="430" x2="400" y2="430" stroke="#e1e5ef"/>
    <text x="152" y="474" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#7d859c">PROJECT FILES</text>
    <g font-family="Inter,Arial,sans-serif" font-size="13" fill="#53607c">
      <text x="158" y="518">客户反馈.docx</text>
      <text x="158" y="558">上线清单.xlsx</text>
      <text x="158" y="598">会议纪要.md</text>
      <text x="158" y="638">页面截图.png</text>
    </g>
    <text x="474" y="210" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.4" fill="#78829b">产品上线资料</text>
    <text x="474" y="250" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="720" fill="#121827">整理反馈，给出上线前的优先级</text>
    <rect x="474" y="288" width="770" height="92" rx="18" fill="#f5f7fc" stroke="#e4e8f1"/>
    <text x="502" y="324" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="650" fill="#586ce8">你</text>
    <text x="502" y="352" font-family="Inter,Arial,sans-serif" font-size="16" fill="#313b58">结合工作区里的反馈和上线清单，告诉我今天先处理什么。</text>
    <circle cx="500" cy="432" r="22" fill="#586ce8"/>
    <text x="493" y="439" font-family="Georgia,serif" font-size="23" font-weight="700" fill="#fff">L</text>
    <text x="536" y="428" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#121827">Lily</text>
    <text x="536" y="454" font-family="Inter,Arial,sans-serif" font-size="13" fill="#7a849c">已阅读 4 份项目材料</text>
    <text x="474" y="508" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#121827">建议今天先处理这 3 项</text>
    <g font-family="Inter,Arial,sans-serif">
      <rect x="474" y="536" width="858" height="84" rx="16" fill="#fbfcff" stroke="#e4e8f1"/>
      <circle cx="510" cy="578" r="16" fill="#e8ecff"/><text x="505" y="584" font-size="14" font-weight="700" fill="#586ce8">1</text>
      <text x="542" y="568" font-size="15" font-weight="680" fill="#222c48">修复登录后的空白状态</text>
      <text x="542" y="592" font-size="13" fill="#6f7890">3 条客户反馈指向同一问题，影响首次使用。</text>
      <rect x="474" y="634" width="858" height="84" rx="16" fill="#fbfcff" stroke="#e4e8f1"/>
      <circle cx="510" cy="676" r="16" fill="#e8ecff"/><text x="505" y="682" font-size="14" font-weight="700" fill="#586ce8">2</text>
      <text x="542" y="666" font-size="15" font-weight="680" fill="#222c48">补齐下载页的安装说明</text>
      <text x="542" y="690" font-size="13" fill="#6f7890">减少用户在首次安装时的疑问。</text>
      <rect x="474" y="732" width="858" height="84" rx="16" fill="#fbfcff" stroke="#e4e8f1"/>
      <circle cx="510" cy="774" r="16" fill="#e8ecff"/><text x="505" y="780" font-size="14" font-weight="700" fill="#586ce8">3</text>
      <text x="542" y="764" font-size="15" font-weight="680" fill="#222c48">确认发布清单中的负责人</text>
      <text x="542" y="788" font-size="13" fill="#6f7890">有 2 项仍未分配，建议在发布前确认。</text>
    </g>
    <rect x="474" y="854" width="858" height="58" rx="16" fill="#fff" stroke="#dce1ed"/>
    <text x="502" y="890" font-family="Inter,Arial,sans-serif" font-size="14" fill="#8a93a8">继续追问，或让 Lily 生成一份可执行清单…</text>
    <rect x="1265" y="866" width="52" height="34" rx="11" fill="#586ce8"/>
    <path d="M1282 883h16m0 0-6-6m6 6-6 6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
