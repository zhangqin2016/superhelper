# Build Windows-only dependency packs on a real Windows runner.
#
# This workflow intentionally does not upload to Qiniu or register with the
# Lily server. Download the artifact from GitHub Actions, verify it locally if
# needed, then publish/register from a trusted release machine.

name: Runtime Pack Windows

on:
  workflow_dispatch:
    inputs:
      pack:
        description: "Dependency pack to build"
        required: true
        default: all
        type: choice
        options:
          - all
          - web-automation
          - ffmpeg

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  build-runtime-pack-win32-x64:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify selected source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git log -1 --oneline
          if (-not (Select-String -Path scripts/publish-common-runtime-pack.mjs -Pattern "cmd\.exe|ComSpec" -Quiet)) {
            throw "Selected source_ref does not contain the Windows npm shell runtime-pack fix. Use source_ref=feat/opencode-engine after the latest runtime-pack CI fix."
          }

      - name: Build selected Windows runtime pack(s)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist/runtime-packs | Out-Null
          $pack = "${{ inputs.pack }}"
          if ($pack -eq "all" -or $pack -eq "web-automation") {
            node scripts/publish-common-runtime-pack.mjs --pack web-automation --platform win32-x64
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if ($pack -eq "all" -or $pack -eq "ffmpeg") {
            node scripts/publish-common-runtime-pack.mjs --pack ffmpeg --platform win32-x64
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Create artifact manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $items = Get-ChildItem dist/runtime-packs -Filter "*-win32-x64-*.tar.gz" | ForEach-Object {
            [pscustomobject]@{
              file = $_.Name
              sizeBytes = $_.Length
              sha256 = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            }
          }
          if (-not $items) {
            throw "No Windows runtime-pack artifacts were produced."
          }
          $items | ConvertTo-Json -Depth 4 | Set-Content -Encoding UTF8 dist/runtime-packs/manifest-win32-x64.json
          Get-Content dist/runtime-packs/manifest-win32-x64.json

      - name: Upload runtime-pack artifacts
        uses: actions/upload-artifact@v4
        with:
          name: runtime-packs-win32-x64-${{ inputs.pack }}
          path: |
            dist/runtime-packs/*-win32-x64-*.tar.gz
            dist/runtime-packs/manifest-win32-x64.json
          retention-days: 14
          if-no-files-found: error
