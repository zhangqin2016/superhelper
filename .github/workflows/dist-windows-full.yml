# Build win32 runtime + engine CLI on Windows, then produce the full NSIS/ZIP installer.
# Manual run: Actions → "Windows Full Installer" → Run workflow
# Artifacts: 智能工作台-*-x64.exe / .zip (includes Python + LibreOffice runtime)

name: Windows Full Installer

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: "@anthropic-ai/claude-code version (empty = latest)"
        required: false
        type: string
      skip_libreoffice:
        description: Skip LibreOffice in runtime (faster smoke builds)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dist-windows-full:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Install Claude Code CLI (engine-upstream source)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ inputs.package_version }}".Trim()
          if ($version) {
            npm install -g "@anthropic-ai/claude-code@$version" --include=optional
            npm install -g "@anthropic-ai/claude-code-win32-x64@$version"
          } else {
            npm install -g @anthropic-ai/claude-code --include=optional
            npm install -g @anthropic-ai/claude-code-win32-x64
          }
          $globalModules = npm root -g
          node (Join-Path $globalModules "@anthropic-ai/claude-code/install.cjs")

      - name: Copy engine-upstream.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $destDir = "bundles/win32-x64"
          $dest = Join-Path $destDir "engine-upstream.exe"
          New-Item -ItemType Directory -Force -Path $destDir | Out-Null

          $globalModules = (npm root -g).Trim()
          $candidates = @(
            (Join-Path $globalModules "@anthropic-ai\claude-code-win32-x64\claude.exe"),
            (Join-Path $globalModules "@anthropic-ai\claude-code\node_modules\@anthropic-ai\claude-code-win32-x64\claude.exe")
          )
          $source = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $source) {
            $source = Get-ChildItem -Path $globalModules -Recurse -Filter "claude.exe" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "claude-code-win32-x64" } |
              Sort-Object Length -Descending |
              Select-Object -ExpandProperty FullName -First 1
          }
          if (-not $source) { throw "Could not locate claude-code-win32-x64/claude.exe" }

          Copy-Item -Force $source $dest
          & $dest --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build win32-x64 runtime bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $args = @("--platform", "win32-x64")
          if ("${{ inputs.skip_libreoffice }}" -eq "true") {
            $args += "--skip-libreoffice"
          }
          node scripts/build-runtime-bundle.mjs @args
          bundles/win32-x64/runtime/venv/Scripts/python.exe -c "import pandas, openpyxl, PIL; print('runtime ok')"

      - name: Verify runtime bundle
        run: node scripts/verify-runtime-bundle.mjs --platform win32-x64

      - name: Build Windows installer (NSIS + ZIP)
        run: npx electron-builder --win --x64
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: Verify installer contents
        run: node scripts/verify-win-pack.mjs --expect-runtime

      - name: Report artifact sizes
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Name -match 'x64\.(exe|zip)$' } |
            ForEach-Object { "{0,-40} {1,12:N0} bytes" -f $_.Name, $_.Length }

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-full
          path: |
            dist/*-x64.exe
            dist/*-x64.zip
            dist/*-x64.exe.blockmap
          retention-days: 30
          if-no-files-found: error
