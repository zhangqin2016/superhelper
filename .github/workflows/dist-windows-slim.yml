# Build the default slim Windows installer.
# Manual run: Actions → "Windows Slim Installer" → Run workflow
# Artifacts: 智能工作台-*-x64.exe / .zip (runtime dependencies install from Settings)

name: Windows Slim Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dist-windows-slim:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Ship dirs must not contain macOS junk
        run: node scripts/purge-macos-junk.mjs --check

      - name: Fetch OpenCode engine binary (win32-x64)
        run: node scripts/fetch-opencode-engine.mjs --platform win32-x64

      - name: Purge macOS junk before pack
        run: node scripts/purge-macos-junk.mjs

      - name: Build Windows installer (NSIS + ZIP)
        run: npx electron-builder --win --x64
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: Verify installer contents
        run: node scripts/verify-win-pack.mjs

      - name: Report artifact sizes
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Name -match 'x64\.(exe|zip)$' } |
            ForEach-Object { "{0,-40} {1,12:N0} bytes" -f $_.Name, $_.Length }

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-slim
          path: |
            dist/*-x64.exe
            dist/*-x64.zip
            dist/*-x64.exe.blockmap
          retention-days: 30
          if-no-files-found: error
